default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("PGHOST", "localhost") %>
  port: <%= ENV.fetch("PGPORT", 5432) %>
  username: <%= ENV.fetch("PGUSER", "postgres") %>
  password: <%= ENV.fetch("PGPASSWORD", "postgres") %>

development:
  <<: *default
  database: fastbooking_development

test:
  <<: *default
  database: fastbooking_test

production:
  <<: *default
  database: fastbooking_production
  username: fastbooking
  password: <%= ENV["FASTBOOKING_DATABASE_PASSWORD"] %>
